name: S3 IaC (remote state + lock + import + apply)

on:
  workflow_dispatch:
  push:
    branches: [ IAC ]

jobs:
  s3-iac:
    runs-on: ubuntu-latest
    env:
      # AWS auth
      AWS_REGION:             ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID:      ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY:  ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # Terraform variables (picked up automatically)
      TF_VAR_aws_region:         ${{ secrets.AWS_REGION }}
      TF_VAR_bucket_name:        ${{ secrets.S3_BUCKET_NAME }}          # e.g., projectdevops-blogs-new
      TF_VAR_bucket_policy_json: ${{ secrets.BUCKET_POLICY_JSON }}      # your JSON policy

      TF_IN_AUTOMATION: "true"

      # Remote state infra (must be static in backend block)
      TF_STATE_BUCKET: projectdevops-terraform-state
      TF_LOCK_TABLE:   terraform-locks

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Ensure remote state bucket + lock table exist
        shell: bash
        run: |
          set -euo pipefail
          REG="${AWS_REGION}"
          SB="${TF_STATE_BUCKET}"
          LT="${TF_LOCK_TABLE}"

          # Create S3 state bucket if missing (idempotent)
          if ! aws s3api head-bucket --bucket "$SB" 2>/dev/null; then
            aws s3api create-bucket \
              --bucket "$SB" \
              --region "$REG" \
              --create-bucket-configuration LocationConstraint="$REG"
          fi
          aws s3api put-bucket-versioning \
            --bucket "$SB" \
            --versioning-configuration Status=Enabled

          # Create DynamoDB lock table if missing (idempotent)
          if ! aws dynamodb describe-table --table-name "$LT" >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "$LT" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$REG"
            # wait until ACTIVE
            aws dynamodb wait table-exists --table-name "$LT" --region "$REG"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init (remote backend)
        working-directory: terraform
        run: terraform init -upgrade -input=false -reconfigure

      - name: Ensure existing bucket is imported (only if missing in state)
        working-directory: terraform
        shell: bash
        run: |
          set -euo pipefail
          BN="${TF_VAR_bucket_name}"

          # Explicit sanity check (fail early if wrong bucket)
          if ! aws s3api head-bucket --bucket "$BN" >/dev/null 2>&1; then
            echo "Bucket $BN not found or not accessible."; exit 1
          fi

          ensure_import () {
            local addr="$1"
            if terraform state list 2>/dev/null | grep -q "^${addr}$"; then
              echo "State already has ${addr}"
            else
              echo "Importing ${addr} -> ${BN}"
              terraform import "${addr}" "${BN}" || true
            fi
          }

          ensure_import aws_s3_bucket.this
          ensure_import aws_s3_bucket_ownership_controls.this
          ensure_import aws_s3_bucket_public_access_block.this
          ensure_import aws_s3_bucket_versioning.this
          ensure_import aws_s3_bucket_server_side_encryption_configuration.this
          ensure_import aws_s3_bucket_cors_configuration.this
          ensure_import aws_s3_bucket_policy.this

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -input=false

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve -input=false
