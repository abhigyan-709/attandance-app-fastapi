# .github/workflows/s3-iac.yml
name: S3 IaC (Manage bucket via Terraform)

on:
  workflow_dispatch:
    inputs:
      do_import:
        description: "One-time import existing S3 resources into state?"
        default: "false"
  push:
    branches: [ IAC ]

jobs:
  s3-iac:
    runs-on: ubuntu-latest
    env:
      # AWS auth
      AWS_REGION:             ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID:      ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY:  ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # Let Terraform pick these up automatically:
      TF_VAR_aws_region:         ${{ secrets.AWS_REGION }}
      TF_VAR_bucket_name:        ${{ secrets.S3_BUCKET_NAME }}
      TF_VAR_bucket_policy_json: ${{ secrets.BUCKET_POLICY_JSON }}

      TF_IN_AUTOMATION: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -upgrade

      # One-time import for an existing bucket; run manually with do_import=true
      - name: Terraform Import (one-time)
        if: ${{ github.event.inputs.do_import == 'true' }}
        working-directory: terraform
        run: |
          set -e
          terraform import aws_s3_bucket.this "${TF_VAR_bucket_name}"
          terraform import aws_s3_bucket_ownership_controls.this "${TF_VAR_bucket_name}" || true
          terraform import aws_s3_bucket_public_access_block.this "${TF_VAR_bucket_name}" || true
          terraform import aws_s3_bucket_versioning.this "${TF_VAR_bucket_name}" || true
          terraform import aws_s3_bucket_server_side_encryption_configuration.this "${TF_VAR_bucket_name}" || true
          terraform import aws_s3_bucket_cors_configuration.this "${TF_VAR_bucket_name}" || true
          terraform import aws_s3_bucket_policy.this "${TF_VAR_bucket_name}" || true

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -input=false

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve -input=false
