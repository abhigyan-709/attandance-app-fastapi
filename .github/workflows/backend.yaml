name: Deploy FastAPI to EC2

on:
  push:
    branches:
      - Abhigyans-Code
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      IMAGE_TAG: latest
      CONTAINER_NAME: attendance-app
      APP_PORT: "8000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "${ECR_REPOSITORY}"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" | \
          docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Build image
        run: |
          docker build -t "${ECR_REPOSITORY}:${IMAGE_TAG}" .

      - name: Tag & push image
        run: |
          docker tag "${ECR_REPOSITORY}:${IMAGE_TAG}" "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

      - name: Deploy on EC2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          # App secrets
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_STARTTLS: ${{ secrets.MAIL_STARTTLS }}
          MAIL_SSL_TLS: ${{ secrets.MAIL_SSL_TLS }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          # Push-related
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

          ssh -o StrictHostKeyChecking=no -i private_key.pem "${EC2_USER}@${EC2_HOST}" <<EOF
            set -e

            # Ensure AWS CLI & Docker exist
            if ! command -v aws >/dev/null 2>&1; then
              echo "Installing AWS CLI..."
              sudo apt-get update -y
              sudo apt-get install -y curl unzip
              curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
              unzip -o awscliv2.zip
              sudo ./aws/install
            fi

            if ! command -v docker >/dev/null 2>&1; then
              echo "Installing Docker..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl enable --now docker
              sudo usermod -aG docker ${EC2_USER}
            fi

            # ECR login on EC2
            aws ecr get-login-password --region "${AWS_REGION}" | \
              docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

            # Pull latest image
            docker pull "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

            # Stop/remove old container
            docker stop ${CONTAINER_NAME} || true
            docker rm ${CONTAINER_NAME} || true

            # Write/refresh .env on host
            cat > /home/${EC2_USER}/.env <<ENVEOF
              MONGO_URI=${MONGO_URI}
              AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
              AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
              AWS_REGION=${AWS_REGION}
              MAIL_USERNAME=${MAIL_USERNAME}
              MAIL_PASSWORD=${MAIL_PASSWORD}
              MAIL_FROM=${MAIL_FROM}
              MAIL_PORT=${MAIL_PORT}
              MAIL_SERVER=${MAIL_SERVER}
              MAIL_STARTTLS=${MAIL_STARTTLS}
              MAIL_SSL_TLS=${MAIL_SSL_TLS}
              MAIL_FROM_NAME=${MAIL_FROM_NAME}
              REDIS_HOST=${REDIS_HOST}
              REDIS_PORT=${REDIS_PORT}
              REDIS_PASSWORD=${REDIS_PASSWORD}
              FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
              ENVEOF

            # Write Firebase SA JSON to host (for HTTP v1 if/when you need it)
            cat > /home/${EC2_USER}/firebase-sa.json <<JSONEOF
              ${FIREBASE_SA_JSON}
              JSONEOF
                          chmod 600 /home/${EC2_USER}/firebase-sa.json

            # Run container
            docker run -d --name ${CONTAINER_NAME} \
              -p ${APP_PORT}:8000 \
              --env-file /home/${EC2_USER}/.env \
              -e FIREBASE_SA_PATH=/app/firebase-sa.json \
              -v /home/${EC2_USER}/firebase-sa.json:/app/firebase-sa.json:ro \
              --add-host=host.docker.internal:host-gateway \
              "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"
            EOF
