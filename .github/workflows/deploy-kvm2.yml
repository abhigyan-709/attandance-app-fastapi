name: Deploy FastAPI Backend to Hostinger

on:
  push:
    branches:
      - backend-api
  workflow_dispatch:

concurrency:
  group: deploy-backend-kvm2
  cancel-in-progress: true

env:
  APP_NAME: news-api
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/news-api
  CONTAINER_PORT: "8000"
  HOST_PORT: "8000"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: "📋 Checkout code"
        uses: actions/checkout@v4

      - name: "🔑 [1/4] Login to GHCR"
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          echo "✅ Logged into ghcr.io"

      - name: "🐳 [2/4] Build & Push Docker image"
        run: |
          echo "::group::Docker Build & Push"
          START=$SECONDS
          echo "⏱️  Started at: $(date -u '+%H:%M:%S UTC')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          IMAGE="${{ env.IMAGE_NAME }}"
          SHA_TAG="${IMAGE}:${{ github.sha }}"
          LATEST_TAG="${IMAGE}:latest"

          docker build \
            --progress=plain \
            -t "${SHA_TAG}" \
            -t "${LATEST_TAG}" .

          BUILD_ELAPSED=$(( SECONDS - START ))
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Image built in ${BUILD_ELAPSED}s"
          docker images "${LATEST_TAG}" --format "   Size: {{.Size}}"

          echo ""
          echo "📤 Pushing to GHCR..."
          PUSH_START=$SECONDS
          docker push "${SHA_TAG}"
          docker push "${LATEST_TAG}"
          PUSH_ELAPSED=$(( SECONDS - PUSH_START ))
          echo "✅ Pushed in ${PUSH_ELAPSED}s"

          TOTAL=$(( SECONDS - START ))
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🏁 Build + Push total: ${TOTAL}s"
          echo "::endgroup::"

      - name: "🔄 [3/4] Deploy container"
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: root
          PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Remote Deploy"
          echo "$PRIVATE_KEY" > key.pem
          chmod 600 key.pem

          IMAGE="${{ env.IMAGE_NAME }}:latest"

          # Create env file locally and SCP it (avoids heredoc escaping issues with secrets)
          cat > /tmp/backend.env << 'EOT'
          ADMIN_API_TOKEN=${{ secrets.ADMIN_API_TOKEN }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }}
          CDN_BASE_URL=${{ secrets.CDN_BASE_URL }}
          CLOUDFRONT_DOMAIN=${{ secrets.CLOUDFRONT_DOMAIN }}
          CLOUDFRONT_ENABLED=${{ secrets.CLOUDFRONT_ENABLED }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL=${{ secrets.GEMINI_MODEL }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM=${{ secrets.MAIL_FROM }}
          MAIL_PORT=${{ secrets.MAIL_PORT }}
          MAIL_SERVER=${{ secrets.MAIL_SERVER }}
          MAIL_STARTTLS=${{ secrets.MAIL_STARTTLS }}
          MAIL_SSL_TLS=${{ secrets.MAIL_SSL_TLS }}
          MAIL_FROM_NAME=${{ secrets.MAIL_FROM_NAME }}
          MONGO_URI=${{ secrets.MONGO_URI }}
          NEWS_BASE_URL=${{ secrets.NEWS_BASE_URL }}
          NEWS_UI_BASE_URL=${{ secrets.NEWS_UI_BASE_URL }}
          NEWS_VAPID_PUBLIC_KEY=${{ secrets.NEWS_VAPID_PUBLIC_KEY }}
          NEWS_VAPID_PRIVATE_KEY=${{ secrets.NEWS_VAPID_PRIVATE_KEY }}
          NEWS_VAPID_SUBJECT=${{ secrets.NEWS_VAPID_SUBJECT }}
          REDIS_HOST=${{ secrets.REDIS_HOST }}
          REDIS_PORT=${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
          VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT=${{ secrets.VAPID_SUBJECT }}
          ENVIRONMENT=production
          EOT

          scp -o StrictHostKeyChecking=no -i key.pem /tmp/backend.env $USER@$HOST:/root/backend.env

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i key.pem $USER@$HOST << DEPLOY
            set -e

            step() { echo ""; echo "━━━ \$1 ━━━"; echo "⏱️  \$(date -u '+%H:%M:%S UTC')"; }

            DEPLOY_START=\$SECONDS

            step "DISK SPACE"
            df -h / | tail -1 | awk '{printf "   Total: %s | Used: %s (%s) | Free: %s\n", \$2, \$3, \$5, \$4}'

            step "LOGIN TO GHCR"
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "   ✅ Logged into ghcr.io"

            step "PULLING IMAGE"
            PULL_START=\$SECONDS
            docker pull ${IMAGE}
            echo "   ✅ Pulled in \$(( SECONDS - PULL_START ))s"

            step "DOCKER IMAGES"
            docker images --format "   {{.Repository}}:{{.Tag}}  {{.Size}}  ({{.CreatedSince}})" | head -5

            step "STOPPING OLD CONTAINER"
            if docker ps -q --filter name=news-api | grep -q .; then
              docker stop news-api && docker rm news-api
              echo "   ✅ Old container removed"
            else
              echo "   ℹ️  No running container found"
              docker rm news-api 2>/dev/null || true
            fi

            step "STARTING NEW CONTAINER"
            CONTAINER_ID=\$(docker run -d \
              --name news-api \
              -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
              --restart unless-stopped \
              --env-file /root/backend.env \
              --add-host=host.docker.internal:host-gateway \
              ${IMAGE})
            echo "   Container ID: \${CONTAINER_ID:0:12}"

            step "HEALTH CHECK"
            HEALTHY=false
            for i in 1 2 3 4 5 6; do
              sleep 5
              STATUS=\$(docker inspect --format='{{.State.Status}}' news-api 2>/dev/null || echo "unknown")
              if [ "\$STATUS" != "running" ]; then
                echo "   ❌ Container status: \$STATUS"
                echo "   --- Last 30 lines of logs ---"
                docker logs --tail 30 news-api 2>&1 || true
                exit 1
              fi
              if curl -sf -o /dev/null -w "   Attempt \${i}: HTTP %{http_code} in %{time_total}s\n" http://localhost:${{ env.HOST_PORT }}/docs 2>/dev/null; then
                HEALTHY=true
                break
              fi
              echo "   Attempt \${i}: not ready yet..."
            done

            if \$HEALTHY; then
              echo "   ✅ API is healthy and responding!"
            else
              echo "   ⚠️  API didn't respond after 30s — check manually"
              echo "   --- Container logs ---"
              docker logs --tail 50 news-api 2>&1 || true
            fi

            step "CONTAINER STATUS"
            docker ps --filter name=news-api --format "   Status: {{.Status}} | Ports: {{.Ports}}"

            step "CLEANUP"
            PRUNED=\$(docker image prune -f 2>&1 | tail -1)
            echo "   \$PRUNED"

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚀 DEPLOY COMPLETE in \$(( SECONDS - DEPLOY_START ))s"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          DEPLOY

          echo "::endgroup::"

      - name: "🧹 [4/4] Cleanup"
        if: always()
        run: rm -f key.pem /tmp/backend.env
